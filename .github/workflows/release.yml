name: Release

# 触发：推版本标签（如 v1.0.0）时发布；也支持手动为已存在的标签补发
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要为其创建 Release 的标签（需已存在）'
        required: true

permissions:
  # 创建 Release 需要写权限（GITHUB_TOKEN 默认只读）
  contents: write

jobs:
  release:
    name: 构建前端并发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 🔴 2026-09-16 修（审计 C-M3）：原先硬编码 `'22'`，而 `.nvmrc` = 24、
          #    `package.json` 的 engines 要求 `>=24` —— 发布产物与声明的引擎不一致
          #    （提交 e5c5088「统一到 Node 24 单一版本」改一处漏一处）。
          #    改用与 ci.yml **同一个真源**（`.nvmrc`），此后不会再漂移。
          node-version-file: '.nvmrc'
          cache: npm

      # ⚠️ 必须放在 `npm ci` **之前**，原因同 ci.yml：
      #    本机 npm 会给其它平台的原生可选依赖写下没有 version 的占位条目，
      #    Windows 能忍，但 **Linux 的 `npm ci` 直接报 `npm error Invalid Version:`**。
      #    若不先跑守卫，就只剩一条难以定位的安装失败。
      #    release 由 tag 触发、**不经过 ci.yml**（后者只监听 main/master 的 push 与 PR），
      #    所以这道闸必须自带。
      - name: lockfile 守卫
        run: node scripts/check-lockfile.mjs

      - name: 安装依赖
        run: npm ci

      # 同理：发布前也要过一次类型检查 —— tag 推送不会触发 ci.yml 的 job。
      # 宁可发布失败，也不要发一个类型都过不了的产物出去。
      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端
        run: npm run build

      # 为什么附 dist：
      #   仓库里**不含** dist（.gitignore 已排除），使用者首次 start.cmd 时会自动构建一次。
      #   把构建产物附在 Release 上，是给不想在本机跑构建的人一份现成的。
      # ⚠️ 它**不能**免掉 `npm install` —— 运行需要 node_modules（含 better-sqlite3 原生
      #    模块），而那是平台相关的，不适合打包进来。
      #
      # ⚠️ 这里刻意不用 heredoc：heredoc 的内容必须顶格，会破坏 YAML 的块标量
      #    （实测被 PyYAML 报 "could not find expected ':'"）。改用 printf + 反斜杠续行，
      #    每一续行都保持与块同级或更深的缩进。
      - name: 打包产物（附一份安装说明）
        run: |
          printf '%s\n' \
            '本压缩包只有前端构建产物（dist/）。完整使用方法：' \
            '' \
            '1. 下载本仓库源码（或本 Release 页面的 Source code 压缩包）' \
            '2. 在项目根目录执行：npm install' \
            '3. 把本压缩包解出的 dist/ 放进项目根目录（覆盖同名目录）' \
            '4. Windows 双击 start.cmd；其它平台用 npm run dev' \
            '' \
            '端口默认 47831（取自 config/port.txt）。详见 README。' \
            > dist/安装说明.txt
          cd dist && zip -r ../kanban-dist.zip . && cd ..
          ls -lh kanban-dist.zip

      - name: 创建 Release（自动生成变更说明）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name || inputs.tag }}"
          gh release create "$TAG" kanban-dist.zip \
            --title "$TAG" \
            --generate-notes
