name: CI

# 触发：推送到主分支 / 任何 PR / 手动
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行被新推送取消（省额度，也避免"旧结果误导"）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · build · 离线自检
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 版本只有一个真源：仓库根的 `.nvmrc`。
      # 本地用 nvm/fnm 时读的是同一个文件 ⇒ **CI 与本地不会漂移**。
      # 想换版本（例如升到 Active LTS 24）只改 `.nvmrc` 一行即可。
      #
      # ⚠️ 曾经写成 ['20','22'] 的矩阵，两个问题：
      #   ① Node 20 已于 2026-03-24 EOL ⇒ 测它没有意义
      #   ② 两个版本把 CI 时长直接翻倍（本项目 npm ci + 构建约 3–5 分钟/腿）
      #   本项目实际运行在 Node 22，CI 就固定测 22 —— 测"你真正用的那个"才有意义。
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # ⚠️ 必须放在 `npm ci` **之前**。
      #    本机 npm 会给其它平台的二进制可选依赖写下没有 version 的占位条目
      #    （形如 {"dev":true,"optional":true}），Windows 本地能忍，
      #    **Linux 的 `npm ci` 直接报 `npm error Invalid Version:`**。
      #    若先跑 npm ci，它会在守卫之前就炸掉，看不到可读的诊断。
      #    （2026-09-15 实测：两库 CI 首跑就是这么挂的 —— node 20/22 双双卡在「安装依赖」。）
      - name: lockfile 守卫
        run: node scripts/check-lockfile.mjs

      # 🔴 2026-09-16 补（审计 C-M2）：本地 pre-commit **可以**被
      #   `git commit --no-verify` 显式绕过，网页端 / GitHub 直推更是完全不经过它。
      #   这里用 `--all` 扫「全部已跟踪 + 未忽略的文件」，把绕过的口子堵在 CI 这层。
      #   纯静态检查、不依赖 node_modules ⇒ 放在 `npm ci` 之前快速失败。
      - name: 误提交与密钥扫描（防绕过本地 hook）
        run: node scripts/check-commit.mjs --all

      # 用 ci 而不是 install：严格按 lockfile 装，避免"本地能过 CI 过不了"
      - name: 安装依赖
        run: npm ci

      # 前端 + 后端两份 tsconfig 都要过
      - name: 类型检查
        run: npm run typecheck

      # 这一步顺带证明"构建没坏"（dist 不进仓库，但必须能构建出来）
      - name: 构建前端
        run: npm run build

      # 以下都是纯离线自检，不碰网络、不碰宿主数据：
      #   check-hook-order      —— React hook 顺序守卫
      #   check-host-readonly   —— 宿主库只读铁律守卫
      #   verify-repeat         —— 定期循环（纯函数）用例
      #   verify-countdown-text —— 倒计时文案用例
      #   verify-board-rules    —— **看板归类规则**（纯函数，无需起服务）
      #                            它 import 的是 `.ts`，这里靠 Node ≥22.18 的
      #                            **默认类型剥离**直接跑（`.nvmrc` = 24，已在同版本实测通过）
      - name: 守卫与用例
        run: |
          node scripts/check-hook-order.mjs
          node scripts/check-host-readonly.mjs
          node scripts/verify-repeat.mjs
          node scripts/verify-countdown-text.mjs
          node scripts/verify-board-rules.ts

      # 🔴 2026-09-16 补（审计 H5）：下面这两个脚本**此前从不被执行** ——
      #    原先 ci.yml 与 check.cmd 都只跑上面那批，它们只在 CHANGELOG 里被称作「用例」，
      #    于是形成"看着有覆盖、实际零门禁"的错觉。
      #    两者都自带 CHAT_DB_PATH 与独立端口（会 spawn 一个隔离实例），不碰真实库、不碰宿主。
      #      verify-repeat-api         —— 定期循环 HTTP 入口校验（39 项）
      #      verify-repeat-integration —— v7 迁移断言 + 调度集成（40 项）
      - name: 循环接口与集成冒烟
        run: |
          # api 冒烟自身不 import 服务端模块（它是 spawn 一个 tsx 子进程去跑 server），
          # 所以 `node` 直接跑即可。
          node scripts/verify-repeat-api.mjs
          # ⚠️ integration 会 `import('../server/db.ts')`，而服务端模块内部用的是
          #    `'./scopes.js'` 这类「TS 源码 + .js 后缀」写法（由 tsc/tsx 负责解析）。
          #    Node 原生 ESM **不会**把 .js 映射回 .ts ⇒ 必须经 tsx 运行，
          #    否则报 `ERR_MODULE_NOT_FOUND: .../server/scopes.js`
          #    （2026-09-16 在 Node 24 实测；同一个脚本用 tsx 跑则 40 项全过）。
          node node_modules/tsx/dist/cli.mjs scripts/verify-repeat-integration.mjs
